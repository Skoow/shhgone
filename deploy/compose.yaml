# Pile de production de Shhdrop : Caddy (TLS) devant le serveur Go (spec §6, §15, §22, §36).
# Lancée par deploy.sh, qui fournit les variables depuis deploy/.env et l'empreinte de l'image.
#
# Variables obligatoires :
#   SHH_IMAGE      image du serveur, épinglée par empreinte : dépôt@sha256:…
#   SHH_DOMAIN     nom du site (exemple : shhgone.com)
#   SHH_DATA_ROOT  point de montage du volume chiffré (LUKS2, noatime), par exemple /srv/shhdrop.
#                  Doit contenir « data » et « caddy » (compte 65532, mode 0700).
# Variables facultatives :
#   SHH_STORAGE_MAX  plafond de stockage en octets (défaut : 200 Gio, spec §24)
#   SHH_SHARE_EGRESS_MAX  octets servis au plus par un partage, toutes ouvertures confondues
#                    (défaut : 250 Gio, au moins 32 Gio ; README §11)
#   SHH_UPLOADS_MAX, SHH_DOWNLOADS_MAX, SHH_WATCH_MAX, SHH_WS_MAX, SHH_DISK_OPS_MAX : capacité
#                    (défaut : calculée d'après GOMEMLIMIT et nofile, README §11)
#   SHH_SALONS_MAX   salons vivants au plus (défaut : 200 ; 50 proposé pour un usage personnel),
#                    sans effet tant que le salon est désactivé (SHH_SALONS, ci-dessous)
#   SHH_COMPTES_MAX, SHH_COMPTES_JOUR : compte par passkey (README §12), sans effet tant que le
#                    compte est désactivé (SHH_COMPTES)
#
# Réseau : Caddy utilise le réseau de la machine (il voit donc toujours la vraie adresse
# du client, en IPv4 comme en IPv6, sans dépendre de la traduction d'adresses de Docker).
# Le serveur Go est sur un réseau Docker interne, sans route vers Internet et sans port
# publié : seul Caddy, depuis la machine, peut le joindre. Le compte par passkey n'a aucune
# sortie (ni e-mail ni relais SMTP). Paiement activé seulement
# (SHH_PAIEMENT: "1", ci-dessous) : un relais par prestataire configuré (même image,
# « shhcheck relais », 172.30.53.4 Stripe, .5 PayPal, .6 NOWPayments, profils « paiement-… »),
# sur ce réseau interne ET sur le réseau « sortie », vers le seul hôte de l'API du prestataire,
# port 443 (README §13 ; conception du paiement §4). Le serveur n'a donc AUCUNE route vers
# Internet ; rien d'autre n'est joignable, même paiement activé.
#
# Secrets (clé du compte, prestataires) : fichiers de <SHH_DATA_ROOT>/secrets, montés en lecture
# seule dans /run/secrets, hors de /data (jamais sauvegardés avec la base, jamais en variable
# d'environnement : docker inspect ne montre que leurs chemins).

name: shhdrop

services:
  shhdrop:
    image: ${SHH_IMAGE:?SHH_IMAGE manquant (dépôt@sha256:…)}
    restart: unless-stopped
    user: "65532:65532"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    # Pas de vidage mémoire (spec §22) : il contiendrait des adresses et des jetons.
    ulimits:
      core: 0
      # Descripteurs : explicites, pour que les places calculées (au plus nofile / 8 par
      # catégorie, config/capacity.go) ne dépendent pas du réglage de Docker sur la machine.
      nofile: 65536
    # Fils du système : Go crée un fil par appel système bloquant
    # (lecture, écriture, fsync, SQLite). 256 pouvait être atteint sous un disque lent, et le
    # processus s'arrêtait net (« failed to create new OS thread »). 1 024, et les appels de
    # fichiers sont bornés par le serveur : SHH_DISK_OPS_MAX (64) pour les partages et les
    # pièces, plus deux bornes du quart (16 + 16) pour les conversations du salon, soit 96 fils
    # au pire. Le serveur lit cette limite et refuse de démarrer si ces fils en dépasseraient
    # la moitié (README §11).
    pids_limit: 1024
    # Plafonds : un abus ou une fuite de mémoire ne fait pas tomber la
    # machine (sshd, Caddy, déverrouillage du volume). Pire cas avec les places calculées
    # d'après GOMEMLIMIT (README §11) : 67 envois simultanés gardés en mémoire (≤ 4 Mio
    # chacun) = 268 Mio, plus 360 téléchargements avec un tampon de 256 Kio chacun = 90 Mio,
    # soit 358 Mio de données vivantes ; le ramasse-miettes de Go peut doubler le tas
    # (GOGC=100) : ≈ 716 Mio, plus SQLite et le reste du serveur. 1 Gio laisse de la marge ; GOMEMLIMIT (un peu en dessous) fait
    # travailler le ramasse-miettes avant que le noyau ne tue le processus. Au-delà de 1 Gio :
    # arrêt brutal, puis redémarrage automatique (envois en cours perdus, comme tout redémarrage).
    # CPU : 1,5 processeur (Go règle GOMAXPROCS d'après cette limite) ; il faut donc au moins
    # 2 processeurs sur la machine, sinon Docker refuse de démarrer le conteneur (README, §1).
    mem_limit: 1g
    memswap_limit: 1g
    cpus: 1.5
    environment:
      GOMEMLIMIT: 900MiB
      SHH_DATA_DIR: /data
      SHH_STATIC_DIR: /site
      # Toutes les interfaces DU CONTENEUR (réseau interne + sa boucle locale, pour le
      # contrôle de santé). Accepté par le serveur parce que les deux lignes suivantes sont là.
      SHH_LISTEN: 0.0.0.0:8080
      # Échec fermé : sans X-Shh-Client-IP valide posé par Caddy, /api répond 500.
      SHH_BEHIND_PROXY: "1"
      # Seul pair de confiance : la passerelle du réseau interne, c'est-à-dire la machine,
      # où Caddy écoute. /32 : le serveur ne croit X-Shh-Client-IP de personne d'autre.
      SHH_TRUSTED_PROXY: 172.30.53.1/32
      SHH_STORAGE_MAX: ${SHH_STORAGE_MAX:-214748364800}
      SHH_SHARE_EGRESS_MAX: ${SHH_SHARE_EGRESS_MAX:-}
      # Salon (spec §39) : ACTIVÉ et OUVERT AU PUBLIC dès le premier déploiement (le compte
      # l'exige). Risque assumé : ouvert sans l'avis du juriste sur l'hébergement des
      # conversations (Q-SAL8, §39.7). Le couper : "0" ici.
      SHH_SALONS: "1"
      # Origine publique du site, comparée à l'en-tête Origin du WebSocket et copiée dans la CSP.
      # Vérifiée même salon coupé : une valeur refusée (majuscules dans SHH_DOMAIN, par exemple)
      # empêche le serveur de démarrer ET « shhdrop admin » de tourner (deploy/README.md §10).
      SHH_ORIGIN: https://${SHH_DOMAIN:?SHH_DOMAIN manquant (nom du site)}
      SHH_SALONS_MAX: ${SHH_SALONS_MAX:-200}
      # Appels audio et vidéo du salon (README §14) : posés par deploy.sh (relais « relais-turn »
      # ci-dessous, profil « appels », actif par défaut) ; vides = pas d'appels. Le serveur ne
      # parle jamais au relais : il calcule des identifiants temporaires avec le secret partagé.
      SHH_TURN_URLS: ${SHH_TURN_URLS:-}
      SHH_TURN_SECRET_FILE: ${SHH_TURN_SECRET_FILE:-}
      # Capacité (README §11) : vide = calculée au démarrage d'après GOMEMLIMIT et nofile.
      SHH_UPLOADS_MAX: ${SHH_UPLOADS_MAX:-}
      SHH_DOWNLOADS_MAX: ${SHH_DOWNLOADS_MAX:-}
      SHH_WATCH_MAX: ${SHH_WATCH_MAX:-}
      SHH_WS_MAX: ${SHH_WS_MAX:-}
      SHH_DISK_OPS_MAX: ${SHH_DISK_OPS_MAX:-}
      # Limite anti-abus par personne, réglable : segments par minute et par connexion (1 500).
      SHH_SEGMENTS_PER_MIN: ${SHH_SEGMENTS_PER_MIN:-}
      # Trames non volatiles rangées au plus par salon (100 000 ≈ 417 Mo de disque).
      SHH_SALON_FRAMES_MAX: ${SHH_SALON_FRAMES_MAX:-}
      # Compte par passkey (conception docs/conception/specs/2026-11-22-compte-passkey-design.md,
      # README §12) : ACTIVÉ et OUVERT AU PUBLIC dès le premier déploiement. Risque assumé :
      # ouvert sans le passage manuel sur appareils réels (conception §14) et sans l'avis du
      # juriste (risque LCEN, spec §37). Exige SHH_SALONS: "1" et, pour deploy.sh,
      # SHH_DOMAIN=shhgone.com : l'hôte de SHH_ORIGIN est le rp.id des passkeys, définitif.
      # Aucun e-mail, aucun relais, aucune sortie. Le couper : "0" ici (fichier relu, commité).
      SHH_COMPTES: "1"
      SHH_COMPTES_MAX: ${SHH_COMPTES_MAX:-}
      SHH_COMPTES_JOUR: ${SHH_COMPTES_JOUR:-}
      SHH_COMPTES_CLE_FILE: /run/secrets/shh_comptes_cle
      # Tableau de bord d'administration (README §4) : vides, il n'existe pas. Écouteur à part
      # (172.30.53.2:9191, réseau interne, aucun port publié, joint par tunnel SSH) ; Caddy ne
      # relaie que vers :8080, barrière de préproduction comprise. Empreinte du jeton seulement.
      SHH_ADMIN_LISTEN: ${SHH_ADMIN_LISTEN:-}
      SHH_ADMIN_TOKEN_SHA256: ${SHH_ADMIN_TOKEN_SHA256:-}
      # Paiement des offres Plus et Pro (conception du paiement, docs/conception/specs/
      # 2026-11-19-paiement-design.md) : DÉSACTIVÉ tant que manque ce que liste son §13 (comptes
      # des prestataires, régime de TVA, mentions des notes de vente). Activé ("1") : deploy.sh
      # démarre le relais de chaque prestataire dont les secrets sont dans secrets/ (README §13)
      # et refuse d'installer sans SHH_TVA ni secrets bien réglés. Comme SHH_COMPTES : la valeur de production est ici (le chiffre après « :- »,
      # fichier relu, commité), jamais dans .env. SHH_PAIEMENT_SERVI et SHH_PAIEMENT_ESSAI_SERVI
      # sont posées par deploy.sh : cette valeur, sauf en préproduction (SHH_PREPROD=1), où
      # SHH_PREPROD_PAIEMENT et SHH_PREPROD_PAIEMENT_ESSAI de deploy/.env la remplacent (README §15).
      SHH_PAIEMENT: "${SHH_PAIEMENT_SERVI:-0}"
      # "1" : bacs à sable des prestataires (clés d'essai) ; choisit aussi l'hôte des relais.
      # Refusé par deploy.sh sans la barrière de préproduction (toute carte de test « paie »).
      SHH_PAIEMENT_ESSAI: "${SHH_PAIEMENT_ESSAI_SERVI:-0}"
      SHH_TVA: ${SHH_TVA:-}
      SHH_STRIPE_TAXE: ${SHH_STRIPE_TAXE:-}
      # Chemins et identifiants posés par deploy.sh d'après les fichiers de secrets/ (vides :
      # prestataire absent). Aucune valeur de secret : des chemins …_FILE seulement.
      SHH_STRIPE_CLE_FILE: ${SHH_STRIPE_CLE_FILE:-}
      SHH_STRIPE_WEBHOOK_FILE: ${SHH_STRIPE_WEBHOOK_FILE:-}
      SHH_PAYPAL_CLIENT_ID: ${SHH_PAYPAL_CLIENT_ID:-}
      SHH_PAYPAL_SECRET_FILE: ${SHH_PAYPAL_SECRET_FILE:-}
      SHH_PAYPAL_WEBHOOK_ID: ${SHH_PAYPAL_WEBHOOK_ID:-}
      SHH_PAYPAL_PLANS: ${SHH_PAYPAL_PLANS:-}
      SHH_NOWPAYMENTS_CLE_FILE: ${SHH_NOWPAYMENTS_CLE_FILE:-}
      SHH_NOWPAYMENTS_IPN_FILE: ${SHH_NOWPAYMENTS_IPN_FILE:-}
    networks:
      interne:
        ipv4_address: 172.30.53.2
    # API des prestataires de paiement : chacune désigne son relais (hôte de production ou de bac
    # à sable, choisi par deploy.sh d'après SHH_PAIEMENT_ESSAI), seule adresse joignable. Relais
    # arrêté : rien.
    extra_hosts:
      - "${SHH_HOTE_STRIPE:-api.stripe.com}:172.30.53.4"
      - "${SHH_HOTE_PAYPAL:-api-m.paypal.com}:172.30.53.5"
      - "${SHH_HOTE_NOWPAYMENTS:-api.nowpayments.io}:172.30.53.6"
    volumes:
      # Sous-dossier du volume chiffré, jamais créé par Docker : si le volume n'est pas
      # déverrouillé et monté, le conteneur ne démarre pas, au lieu d'écrire sur le disque
      # système en clair (spec §22).
      - type: bind
        source: ${SHH_DATA_ROOT:?SHH_DATA_ROOT manquant (point de montage du volume chiffré)}/data
        target: /data
        bind:
          create_host_path: false
      # Secrets (clé du serveur du compte, prestataires de paiement) : dossier du volume chiffré,
      # root:65532 0750, fichiers 65532 0400 (README §12, §13), lecture seule, hors de /data.
      # Exigé même compte désactivé (dossier vide) : jamais créé par Docker sur le disque
      # système.
      - type: bind
        source: ${SHH_DATA_ROOT:?SHH_DATA_ROOT manquant}/secrets
        target: /run/secrets
        read_only: true
        bind:
          create_host_path: false
    # Fichiers temporaires éventuels : en mémoire, jamais sur disque.
    tmpfs:
      - /tmp:size=64m,mode=1777,noexec,nosuid,nodev
    # Aucun journal de conteneur sur disque (spec §36 S1).
    # Pour lire un message de démarrage : « deploy.sh diagnose » (premier plan, rien d'écrit).
    logging:
      driver: none
    # Le serveur laisse 30 s aux transferts en cours avant de s'arrêter.
    stop_grace_period: 40s
    healthcheck:
      # /healthz ne répond qu'à la boucle locale du conteneur, sans passer par Caddy (spec §8).
      test: ["CMD", "/shhcheck", "health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
      start_interval: 2s

  # Relais TURN des appels audio et vidéo du salon (profil « appels », posé par deploy.sh sauf
  # SHH_APPELS=0 dans deploy/.env ; conception des appels, README §14). Même image (binaire
  # /shhcheck, deploy/shhcheck/turn.go) : rien à installer sur la machine. Réseau de la machine :
  # le relais doit annoncer et recevoir sur l'adresse publique, port 3478 (UDP et TCP) et la plage
  # 49160-49999 (UDP) ; publier 840 ports par Docker serait lent et fragile. Il ne voit que des
  # paquets chiffrés de bout en bout, ne relaie vers aucune adresse privée ni vers un autre port
  # de la machine, et n'écrit rien (aucun journal).
  relais-turn:
    image: ${SHH_IMAGE:?SHH_IMAGE manquant (dépôt@sha256:…)}
    profiles: ["appels"]
    restart: unless-stopped
    entrypoint: ["/shhcheck"]
    command: ["turn"]
    network_mode: host
    user: "65532:65532"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    ulimits:
      core: 0
      nofile: 4096
    pids_limit: 128
    mem_limit: 256m
    memswap_limit: 256m
    cpus: 1.0
    environment:
      GOMEMLIMIT: 200MiB
      SHH_TURN_SECRET_FILE: /run/secrets/shh_turn_secret
      # Adresse publique : vide = celle de la route par défaut (machine louée ordinaire) ;
      # derrière un routeur, la poser dans deploy/.env.
      SHH_TURN_IP: ${SHH_TURN_IP:-}
      SHH_TURN_ALLOCATIONS: ${SHH_TURN_ALLOCATIONS:-}
      SHH_TURN_KBPS: ${SHH_TURN_KBPS:-}
    volumes:
      - type: bind
        source: ${SHH_DATA_ROOT:?SHH_DATA_ROOT manquant}/secrets
        target: /run/secrets
        read_only: true
        bind:
          create_host_path: false
    logging:
      driver: none

  # Relais des prestataires de paiement (profils « paiement-stripe », « paiement-paypal »,
  # « paiement-nowpayments », posés par deploy.sh pour chaque prestataire configuré, paiement
  # activé). Même image que le serveur (binaire /shhcheck, deploy/shhcheck/relais.go) : aucune
  # image de plus à épingler. Chacun recopie chaque connexion reçue vers une seule cible, l'hôte
  # de l'API sur 443, résolu à chaque connexion, sans rien laisser choisir au client ; TLS de bout
  # en bout (certificat vérifié par le serveur pour ce nom, le relais ne voit que des octets
  # chiffrés) ; 16 connexions à la fois, 60 s chacune au plus (le serveur ouvre une connexion par
  # appel, délai 20 s) ; rien n'est écrit.
  relais-stripe:
    image: ${SHH_IMAGE:?SHH_IMAGE manquant (dépôt@sha256:…)}
    profiles: ["paiement-stripe"]
    restart: unless-stopped
    entrypoint: ["/shhcheck"]
    command: ["relais", "172.30.53.4:443", "${SHH_HOTE_STRIPE:-api.stripe.com}:443", "16"]
    user: "65532:65532"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    sysctls:
      net.ipv4.ip_unprivileged_port_start: "0"
    ulimits:
      core: 0
      nofile: 1024
    pids_limit: 64
    mem_limit: 64m
    memswap_limit: 64m
    cpus: 0.25
    environment:
      GOMEMLIMIT: 48MiB
    networks:
      interne:
        ipv4_address: 172.30.53.4
      sortie: {}
    logging:
      driver: none

  relais-paypal:
    image: ${SHH_IMAGE:?SHH_IMAGE manquant (dépôt@sha256:…)}
    profiles: ["paiement-paypal"]
    restart: unless-stopped
    entrypoint: ["/shhcheck"]
    command: ["relais", "172.30.53.5:443", "${SHH_HOTE_PAYPAL:-api-m.paypal.com}:443", "16"]
    user: "65532:65532"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    sysctls:
      net.ipv4.ip_unprivileged_port_start: "0"
    ulimits:
      core: 0
      nofile: 1024
    pids_limit: 64
    mem_limit: 64m
    memswap_limit: 64m
    cpus: 0.25
    environment:
      GOMEMLIMIT: 48MiB
    networks:
      interne:
        ipv4_address: 172.30.53.5
      sortie: {}
    logging:
      driver: none

  relais-nowpayments:
    image: ${SHH_IMAGE:?SHH_IMAGE manquant (dépôt@sha256:…)}
    profiles: ["paiement-nowpayments"]
    restart: unless-stopped
    entrypoint: ["/shhcheck"]
    command: ["relais", "172.30.53.6:443", "${SHH_HOTE_NOWPAYMENTS:-api.nowpayments.io}:443", "16"]
    user: "65532:65532"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    sysctls:
      net.ipv4.ip_unprivileged_port_start: "0"
    ulimits:
      core: 0
      nofile: 1024
    pids_limit: 64
    mem_limit: 64m
    memswap_limit: 64m
    cpus: 0.25
    environment:
      GOMEMLIMIT: 48MiB
    networks:
      interne:
        ipv4_address: 172.30.53.6
      sortie: {}
    logging:
      driver: none

  caddy:
    # Caddy 2.11.9 officiel (2.10 au minimum pour x25519mlkem768), épinglé par empreinte,
    # relevée le 10 novembre 2026. Changer l'étiquette ET l'empreinte ensemble, puis
    # relancer deploy/test-proxy.sh avec ce binaire.
    image: caddy:2.11.9@sha256:0c2243efcf437ab7f7a978f1027fcf0d4f9be8a75df27b1b3fbc5dbe0ffa8cf0
    restart: unless-stopped
    # Réseau de la machine : Caddy écoute directement sur 80/tcp, 443/tcp et 443/udp (HTTP/3,
    # QUIC). Aucune ligne « ports: » : Docker l'ignore avec
    # network_mode: host (rien n'est publié ni traduit). Le pare-feu de la machine doit laisser
    # passer 443/udp (README §1).
    network_mode: host
    read_only: true
    # Non root : compte 65532, aucune
    # capacité. Écouter sur 80 et 443 vient du réglage de la machine
    # net.ipv4.ip_unprivileged_port_start=80 (README §1, vérifié par deploy.sh) : la capacité de
    # fichier de l'image (« +p ») est ignorée sous no-new-privileges.
    user: "65532:65532"
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    ulimits:
      core: 0
    pids_limit: 256
    # Caddy relaie les corps sans les garder en entier (tampons de quelques dizaines de Kio par
    # connexion) ; TLS 1.3 et HTTP/2 pour quelques centaines de connexions tiennent dans
    # 256 Mio. 1 processeur : AES-GCM (instructions AES du processeur) chiffre plusieurs Gio/s par
    # cœur, bien plus que le lien réseau d'un serveur loué.
    mem_limit: 256m
    memswap_limit: 256m
    cpus: 1.0
    environment:
      SHH_DOMAIN: ${SHH_DOMAIN:?SHH_DOMAIN manquant (nom du site)}
      SHH_UPSTREAM: 172.30.53.2:8080
      # Barrière de préproduction (Caddyfile, README §15) : posées par deploy.sh et preprod.sh
      # (SHH_PREPROD de deploy/.env ; jeton lu dans /etc/shhdrop/preprod-jeton). « 0 » : aucune.
      SHH_PREPROD: "${SHH_PREPROD:-0}"
      SHH_PREPROD_JETON: ${SHH_PREPROD_JETON:-}
    # Empreinte du Caddyfile et de la page de maintenance, calculée par deploy.sh : si l'un change,
    # le conteneur est recréé (l'API d'administration est coupée, donc pas de « caddy reload »).
    labels:
      app.shhdrop.caddyfile: ${SHH_CADDYFILE_SHA256:-}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Page servie au public en préproduction (lue par Caddy à chaque requête).
      - ./maintenance.html:/etc/caddy/maintenance.html:ro
      # Clés et certificats TLS, compte ACME : sur le volume chiffré eux aussi.
      - type: bind
        source: ${SHH_DATA_ROOT:?SHH_DATA_ROOT manquant}/caddy
        target: /data
        bind:
          create_host_path: false
    tmpfs:
      - /config:size=8m,mode=0700,uid=65532,gid=65532,noexec,nosuid,nodev
    logging:
      driver: none
    depends_on:
      - shhdrop

networks:
  interne:
    # Aucune sortie vers Internet depuis le serveur Go, même paiement activé : il ne joint que les
    # relais des prestataires de paiement (.4 à .6), sur ce réseau. /29 : .1 passerelle (Caddy, sur
    # la machine), .2 serveur, .3 libre (ancien relais SMTP, retiré), .4 à .6 relais.
    internal: true
    ipam:
      config:
        - subnet: 172.30.53.0/29
          gateway: 172.30.53.1
  # Sortie des seuls relais de paiement (réseau créé seulement avec un profil « paiement-… »).
  # Ni le serveur ni Caddy n'y sont ; aucun port publié.
  sortie:
    ipam:
      config:
        - subnet: 172.30.53.8/29
          gateway: 172.30.53.9
