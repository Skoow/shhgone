# Registres des connexions vers /dev/null (README §1 ; inventaire des adresses IP du 22 novembre,
# IP5) : sshd y écrit l'adresse de chaque connexion (wtmp, lastlog) et de chaque échec (btmp).
# Installation : install -m 0644 deploy/systemd/00-shhdrop-connexions.conf /etc/tmpfiles.d/
# puis systemd-tmpfiles --create /etc/tmpfiles.d/00-shhdrop-connexions.conf
# « L+ » remplace le fichier existant par le lien, à chaque démarrage aussi ; le préfixe 00
# l'emporte sur les lignes « f » de /usr/lib/tmpfiles.d/var.conf (même chemin : le premier
# fichier par ordre de nom gagne).
L+ /var/log/wtmp    - - - - /dev/null
L+ /var/log/btmp    - - - - /dev/null
L+ /var/log/lastlog - - - - /dev/null
