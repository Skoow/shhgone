<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Shhgone : en cours de maintenance</title>
<style>
:root{color-scheme:light dark;--fond:#f7f7f5;--texte:#1c1c1e;--doux:#5f5f66;--trait:#d9d9d4}
@media (prefers-color-scheme:dark){:root{--fond:#121214;--texte:#ececee;--doux:#a2a2aa;--trait:#2c2c31}}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{display:flex;align-items:center;justify-content:center;padding:24px 16px;background:var(--fond);color:var(--texte);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:34rem;width:100%;border-top:1px solid var(--trait);padding-top:24px}
h1{margin:0 0 12px;font-size:1.5rem;font-weight:600;letter-spacing:-.01em}
p{margin:0 0 12px}
.doux{color:var(--doux);font-size:.9rem}
</style>
</head>
<body>
<main>
<h1>Shhgone est en cours de maintenance</h1>
<p>Le service n'est pas encore ouvert. Revenez un peu plus tard.</p>
<p class="doux" lang="en">Shhgone is under maintenance and not open yet. Please come back later.</p>
</main>
</body>
</html>
