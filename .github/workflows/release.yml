# Release signée du site (spec §28.2 ; deploy/README.md §3) : sur une étiquette web-v<x.y.z>
# posée par le propriétaire sur un commit de main, toute la CI est relancée (tests, builds
# reproductibles sur deux machines, site de l'image identique), le site est reconstruit et décrit
# par release.json (version, commit, chemin, taille et SHA-256 de chaque fichier), puis
# release.json est signé SANS CLÉ par cosign (jeton OIDC de GitHub Actions, certificat Fulcio,
# journal public Rekor) et publié dans la Release GitHub avec son bundle, SHA256SUMS et
# dist.tar.gz. deploy/deploy.sh refuse toute image dont le site n'est pas ce manifeste.
#
# L'image du serveur (décision du propriétaire du 25 novembre ; deploy/README.md §3.2) : construite
# par deploy/construire-image.sh sur deux machines (même empreinte exigée), son /site comparé au
# manifeste, publiée sur ghcr.io/skoow/shhgone (paquet public, lu sans identifiant) et signée
# sans clé par la même identité ; image.json (version, commit, image@empreinte, SHA-256 de
# release.json), signé lui aussi et publié dans la Release, lie l'image au manifeste. deploy.sh
# exige tout cela avant de télécharger l'image.
#
# Aucun secret : la signature vient de l'identité de ce workflow, vérifiée ensuite par
#   cosign verify-blob release.json --bundle release.json.sigstore.json \
#     --certificate-oidc-issuer https://token.actions.githubusercontent.com \
#     --certificate-identity https://github.com/Skoow/shhgone/.github/workflows/release.yml@refs/tags/web-v<x.y.z>
# Ce fichier est donc lui-même une partie de l'identité : le renommer change ce que vérifient
# deploy/provenance.sh, verifier-site.yml et la page /verifier.
#
# Le manifeste n'est pas commité avant l'étiquette (spec §28.2, corrigée le 24 novembre) : le
# numéro de version du site est le commit lui-même, un commit ne peut pas contenir le manifeste
# de son propre build.
name: release

on:
  push:
    tags: ["web-v*"]

permissions: {}

jobs:
  # Toute la CI (.github/workflows/ci.yml), sur le commit de l'étiquette : go, moteur, web, e2e
  # (« le serveur ne voit rien »), repro (deux machines), repro-docker (site de l'image), deploy-lint.
  # Obligatoire : rien n'est signé si un job échoue (spec §28.8, C4).
  ci:
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  manifeste:
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Toute l'histoire : le commit doit être dans main.
          fetch-depth: 0
      - name: Étiquette web-v<x.y.z>, sur un commit de main
        id: version
        env:
          ETIQUETTE: ${{ github.ref_name }}
        run: |
          [ "$GITHUB_REF_TYPE" = tag ] || { echo "pas une étiquette : $GITHUB_REF" >&2; exit 1; }
          # Même forme que version_valide (deploy/provenance.sh).
          [[ $ETIQUETTE =~ ^web-v((0|[1-9][0-9]{0,5})\.(0|[1-9][0-9]{0,5})\.(0|[1-9][0-9]{0,5}))$ ]] ||
            { echo "étiquette hors format : $ETIQUETTE (web-v<x.y.z>)" >&2; exit 1; }
          git merge-base --is-ancestor HEAD origin/main ||
            { echo "le commit $(git rev-parse HEAD) n'est pas dans main : aucune Release" >&2; exit 1; }
          echo "version=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
      # Pas de cache npm : ce job produit ce qui est signé (même règle que pages.yml).
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: web/.node-version
          package-manager-cache: false
      - uses: ./.github/actions/engine-toolchain
      - run: cd web && npm ci --ignore-scripts
      # Mêmes réglages que web/scripts/repro.sh et deploy/Dockerfile (site avec le compte).
      - name: Site de production
        run: |
          umask 022
          export TZ=UTC LANG=C.UTF-8 LC_ALL=C.UTF-8 SHH_SITE_COMPTES=1
          SHH_BUILD_ID=$(git rev-parse --short=7 HEAD)
          SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)
          export SHH_BUILD_ID SOURCE_DATE_EPOCH
          cd web && npm run build && node scripts/check-dist.mjs --comptes
      # Les empreintes du job repro (deux builds sur deux machines, comparées aussi au site de
      # l'image par repro-docker) : le site décrit est celui de ces builds, fichier pour fichier.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sums-ubuntu-latest
          path: sums
      - name: Identique aux builds du job repro
        run: |
          grep '  \./' sums/SHA256SUMS > "$RUNNER_TEMP/ci-dist.sums" || true
          [ -s "$RUNNER_TEMP/ci-dist.sums" ] || { echo "aucun fichier de dist/ dans SHA256SUMS" >&2; exit 1; }
          (cd web/dist && find . -type f -print0 | LC_ALL=C sort -z | xargs -0 sha256sum) > "$RUNNER_TEMP/release-dist.sums"
          diff "$RUNNER_TEMP/ci-dist.sums" "$RUNNER_TEMP/release-dist.sums"
      - name: release.json, SHA256SUMS, dist.tar.gz
        env:
          NUMERO: ${{ steps.version.outputs.version }}
        run: |
          umask 022
          out="$RUNNER_TEMP/release"
          node web/scripts/release-manifest.mjs web/dist --name shhdrop-web --version "$NUMERO" --commit "$(git rev-parse HEAD)" --out "$out"
          # Archive déterministe (spec §28.2) : ordre, dates, propriétaires fixés ; gzip sans nom ni date.
          tar --sort=name --mtime="@$(git log -1 --format=%ct)" --owner=0 --group=0 --numeric-owner \
            -C web/dist -cf - . | gzip -n -9 > "$out/dist.tar.gz"
          ls -l "$out"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: ${{ runner.temp }}/release
          if-no-files-found: error

  # Image du serveur, construite deux fois, sur deux machines, par le même script que celui donné
  # à qui veut la refaire (deploy/construire-image.sh) : publier-image exige la même empreinte.
  # Ce job lance le code npm (dans le build) : aucun droit d'écriture, il ne publie rien.
  image:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    # Même travail que repro-docker (ci.yml), sans cache.
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: deploy/construire-image.sh "$RUNNER_TEMP/image"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-${{ matrix.os }}
          path: ${{ runner.temp }}/image
          if-no-files-found: error

  # Seul job qui peut écrire sur ghcr.io : il ne lance aucun code npm ni build, seulement des
  # contrôles en shell, crane et cosign épinglés. Rien n'est publié si la CI, le manifeste ou
  # l'un des deux builds échoue, si les deux builds diffèrent, ou si le site de l'image n'est pas
  # celui du manifeste ; rien n'est signé si l'image n'est pas lisible sans identifiant.
  publier-image:
    needs: [manifeste, image]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write # pousser l'image et sa signature sur ghcr.io
      id-token: write # jeton OIDC pour signer l'image sans clé (même identité que le manifeste)
    outputs:
      empreinte: ${{ steps.empreinte.outputs.empreinte }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: image-ubuntu-latest
          path: ${{ runner.temp }}/a
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: image-ubuntu-24.04
          path: ${{ runner.temp }}/b
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: ${{ runner.temp }}/release
      - name: Deux machines, une seule empreinte
        id: empreinte
        run: |
          . deploy/provenance.sh
          [ "${GITHUB_REPOSITORY,,}" = "${PROVENANCE_IMAGE#ghcr.io/}" ] ||
            { echo "dépôt $GITHUB_REPOSITORY : l'image serait $PROVENANCE_IMAGE (deploy/provenance.sh)" >&2; exit 1; }
          a=$(empreinte_oci "$RUNNER_TEMP/a/image.tar")
          b=$(empreinte_oci "$RUNNER_TEMP/b/image.tar")
          [ "$a" = "$(cat "$RUNNER_TEMP/a/empreinte")" ] && [ "$b" = "$(cat "$RUNNER_TEMP/b/empreinte")" ] ||
            { echo "empreinte annoncée par le job image différente de celle de son archive" >&2; exit 1; }
          [ "$a" = "$b" ] ||
            { echo "image non reproductible : $a sur une machine, $b sur l'autre (rien n'est publié)" >&2; exit 1; }
          echo "image reproductible : $a"
          echo "empreinte=$a" >> "$GITHUB_OUTPUT"
      # Ce que vérifiera deploy.sh, avant de publier : le /site de l'image est le manifeste, octet
      # pour octet (controle_site), et l'image a ses deux binaires. Couches lues sans les lancer ;
      # aucun lien (une couche ne peut rien écrire hors du dossier), aucune suppression (.wh.).
      - name: Contenu de l'image conforme au manifeste
        env:
          NUMERO: ${{ needs.manifeste.outputs.version }}
          EMPREINTE: ${{ steps.empreinte.outputs.empreinte }}
        run: |
          . deploy/provenance.sh
          oci=$RUNNER_TEMP/oci racine=$RUNNER_TEMP/racine
          mkdir "$oci" "$racine"
          tar -xf "$RUNNER_TEMP/a/image.tar" -C "$oci"
          for f in "$oci"/blobs/sha256/*; do
            [ "$(sha256sum "$f" | cut -d' ' -f1)" = "${f##*/}" ] || { echo "${f##*/} : blob altéré" >&2; exit 1; }
          done
          m=$oci/blobs/sha256/${EMPREINTE#sha256:}
          jq -e '.layers | length > 0 and all(.mediaType == "application/vnd.oci.image.layer.v1.tar+gzip")' "$m" >/dev/null ||
            { echo "couches inattendues dans le manifeste de l'image" >&2; exit 1; }
          for l in $(jq -r '.layers[].digest' "$m"); do
            c=$oci/blobs/sha256/${l#sha256:}
            if tar -tvzf "$c" | grep -qE '^[lhbcp]'; then echo "couche $l : lien ou fichier spécial" >&2; exit 1; fi
            if tar -tzf "$c" | grep -qE '(^|/)\.wh\.|(^|/)\.\.(/|$)'; then echo "couche $l : nom refusé" >&2; exit 1; fi
            tar -xzf "$c" -C "$racine" --no-same-owner
          done
          [ -f "$racine/shhdrop" ] && [ -f "$racine/shhcheck" ] || { echo "binaires absents de l'image" >&2; exit 1; }
          controle_site "$racine/site" "$RUNNER_TEMP/release/release.json" "$NUMERO"
          echo "site de l'image conforme à release.json ($(grep -c '"path"' "$RUNNER_TEMP/release/release.json") fichiers)"
      # crane v0.22.1 (go-containerregistry, publiée le 4 septembre 2026) : empreinte de l'archive
      # relevée le 25 novembre 2026 dans checksums.txt de la Release et recalculée (identiques).
      # crane pousse les octets de l'archive tels quels : l'empreinte publiée est celle des builds.
      - name: crane v0.22.1 et cosign v3.1.4
        run: |
          curl -fsSL -o "$RUNNER_TEMP/crane.tar.gz" https://github.com/google/go-containerregistry/releases/download/v0.22.1/go-containerregistry_Linux_x86_64.tar.gz
          echo "0ab7a1d6932a213aed964ce97666c3077fe691c8606413674a8b3e0b9ec4cda0  $RUNNER_TEMP/crane.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/crane.tar.gz" -C "$RUNNER_TEMP" crane
          curl -fsSL -o "$RUNNER_TEMP/cosign" https://github.com/sigstore/cosign/releases/download/v3.1.4/cosign-linux-amd64
          echo "424e2c97d0b45fd7a6b608a87f090f35633f4c23ece5f092d48bba11aaf4bbfa  $RUNNER_TEMP/cosign" | sha256sum -c -
          chmod 0755 "$RUNNER_TEMP/cosign"
      - name: Publication sur ghcr.io
        env:
          GH_TOKEN: ${{ github.token }}
          NUMERO: ${{ needs.manifeste.outputs.version }}
          EMPREINTE: ${{ steps.empreinte.outputs.empreinte }}
        run: |
          . deploy/provenance.sh
          printf '%s' "$GH_TOKEN" | "$RUNNER_TEMP/crane" auth login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          "$RUNNER_TEMP/crane" push "$RUNNER_TEMP/oci" "$PROVENANCE_IMAGE:web-v$NUMERO"
          vu=$("$RUNNER_TEMP/crane" digest "$PROVENANCE_IMAGE:web-v$NUMERO")
          [ "$vu" = "$EMPREINTE" ] || { echo "publiée sous $vu, pas $EMPREINTE" >&2; exit 1; }
      # Le serveur lit l'image sans identifiant : un paquet privé (défaut de GitHub pour un premier
      # paquet de compte personnel) échoue ici, avant toute signature.
      - name: Image lisible sans identifiant (paquet public)
        env:
          EMPREINTE: ${{ steps.empreinte.outputs.empreinte }}
        run: |
          . deploy/provenance.sh
          nom=${PROVENANCE_IMAGE#ghcr.io/}
          jeton=$(curl -fsS "https://ghcr.io/token?service=ghcr.io&scope=repository:$nom:pull" | jq -r '.token // empty') || jeton=
          code=$(curl -sS -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $jeton" \
            -H 'Accept: application/vnd.oci.image.manifest.v1+json' "https://ghcr.io/v2/$nom/manifests/$EMPREINTE") || code=000
          if [ "$code" != 200 ]; then
            echo "::error::$PROVENANCE_IMAGE@$EMPREINTE illisible sans identifiant (HTTP $code) : le paquet est privé. Le rendre public (deploy/README.md §3.2 : github.com/users/Skoow/packages/container/shhgone/settings, Change visibility, Public), puis « Re-run failed jobs »."
            exit 1
          fi
          echo "lisible sans identifiant : $PROVENANCE_IMAGE@$EMPREINTE"
      - name: Signature sans clé de l'image (Sigstore)
        env:
          EMPREINTE: ${{ steps.empreinte.outputs.empreinte }}
        run: |
          . deploy/provenance.sh
          "$RUNNER_TEMP/cosign" sign --yes "$PROVENANCE_IMAGE@$EMPREINTE"
          rm -f ~/.docker/config.json
      # Vérifiée comme le fera deploy.sh : sans identifiant, identité exacte, journal Rekor exigé.
      - name: Signature de l'image vérifiée avec l'identité de deploy.sh
        env:
          NUMERO: ${{ needs.manifeste.outputs.version }}
          EMPREINTE: ${{ steps.empreinte.outputs.empreinte }}
        run: |
          . deploy/provenance.sh
          DOCKER_CONFIG=$(mktemp -d)
          export DOCKER_CONFIG
          verifier_signature_image "$RUNNER_TEMP/cosign" "$NUMERO" "$EMPREINTE"

  # Seul job qui peut signer et publier la Release : il ne lance aucun code npm ni build (rien de
  # ce qui tourne ici ne vient d'une dépendance), seulement des contrôles en shell, cosign épinglé
  # et gh.
  signer:
    needs: [manifeste, publier-image]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write # créer la Release
      id-token: write # jeton OIDC pour le certificat de signature (cosign sans clé)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: ${{ runner.temp }}/release
      # cosign v3.1.4, même version et même empreinte que deploy/provenance.sh (vérifié par
      # deploy/test-provenance.sh).
      - name: cosign v3.1.4
        run: |
          curl -fsSL -o "$RUNNER_TEMP/cosign" https://github.com/sigstore/cosign/releases/download/v3.1.4/cosign-linux-amd64
          echo "424e2c97d0b45fd7a6b608a87f090f35633f4c23ece5f092d48bba11aaf4bbfa  $RUNNER_TEMP/cosign" | sha256sum -c -
          chmod 0755 "$RUNNER_TEMP/cosign"
      # Avant de signer : le manifeste nomme ce commit et cette version, l'archive est exactement
      # le manifeste (manifeste_de, en shell : ce que fera deploy.sh sur le serveur), SHA256SUMS
      # aussi.
      - name: Contrôles avant signature
        env:
          NUMERO: ${{ needs.manifeste.outputs.version }}
        run: |
          . deploy/provenance.sh
          rel="$RUNNER_TEMP/release"
          version_valide "$NUMERO"
          [ "$(commit_du_manifeste "$rel/release.json")" = "$(git rev-parse HEAD)" ] ||
            { echo "release.json ne nomme pas le commit de l'étiquette" >&2; exit 1; }
          mkdir "$RUNNER_TEMP/site"
          tar -xzf "$rel/dist.tar.gz" -C "$RUNNER_TEMP/site"
          controle_site "$RUNNER_TEMP/site" "$rel/release.json" "$NUMERO"
          (cd "$RUNNER_TEMP/site" && sha256sum -c --strict --quiet "$rel/SHA256SUMS")
          [ "$(wc -l < "$rel/SHA256SUMS")" = "$(find "$RUNNER_TEMP/site" -type f | wc -l)" ] ||
            { echo "SHA256SUMS ne liste pas tous les fichiers" >&2; exit 1; }
      # image.json : l'image publiée (empreinte vérifiée par publier-image), liée à la version, au
      # commit et aux octets de release.json ; même fonction que celle qui le recalcule sur le
      # serveur (deploy/provenance.sh).
      - name: image.json
        env:
          NUMERO: ${{ needs.manifeste.outputs.version }}
          EMPREINTE: ${{ needs.publier-image.outputs.empreinte }}
        run: |
          . deploy/provenance.sh
          rel="$RUNNER_TEMP/release"
          empreinte_valide "$EMPREINTE" || { echo "empreinte de l'image hors format : $EMPREINTE" >&2; exit 1; }
          description_image "$NUMERO" "$(git rev-parse HEAD)" "$EMPREINTE" "$(sha256sum "$rel/release.json" | cut -d' ' -f1)" > "$rel/image.json"
          controle_description_image "$rel/image.json" "$rel/release.json" "$NUMERO" "$EMPREINTE"
          cat "$rel/image.json"
      - name: Signature sans clé (Sigstore)
        working-directory: ${{ runner.temp }}/release
        run: |
          "$RUNNER_TEMP/cosign" sign-blob --yes --bundle release.json.sigstore.json release.json
          "$RUNNER_TEMP/cosign" sign-blob --yes --bundle image.json.sigstore.json image.json
      # Les signatures, vérifiées comme le fera deploy.sh (identité exacte, journal Rekor exigé,
      # image lue sans identifiant) : un nom de dépôt ou de workflow faux dans deploy/provenance.sh
      # échoue ici, pas sur le serveur.
      - name: Signatures vérifiées avec l'identité de deploy.sh
        env:
          NUMERO: ${{ needs.manifeste.outputs.version }}
          EMPREINTE: ${{ needs.publier-image.outputs.empreinte }}
        run: |
          . deploy/provenance.sh
          rel="$RUNNER_TEMP/release"
          verifier_signature "$RUNNER_TEMP/cosign" "$NUMERO" "$rel/release.json" "$rel/release.json.sigstore.json"
          verifier_signature "$RUNNER_TEMP/cosign" "$NUMERO" "$rel/image.json" "$rel/image.json.sigstore.json"
          verifier_signature_image "$RUNNER_TEMP/cosign" "$NUMERO" "$EMPREINTE"
      - name: Release GitHub
        env:
          GH_TOKEN: ${{ github.token }}
          NUMERO: ${{ needs.manifeste.outputs.version }}
          EMPREINTE: ${{ needs.publier-image.outputs.empreinte }}
        run: |
          . deploy/provenance.sh
          rel="$RUNNER_TEMP/release"
          {
            echo "Site et serveur Shhdrop $NUMERO, commit $(git rev-parse HEAD)."
            echo
            echo "Image : $PROVENANCE_IMAGE@$EMPREINTE"
            echo
            echo "Installer (deploy/README.md §3.2 ; le commit doit être celui que donne la conversation de développement, verrou V3) :"
            echo
            echo '```sh'
            echo "deploy/deploy.sh $EMPREINTE $NUMERO $(git rev-parse HEAD)"
            echo '```'
            echo
            echo "Vérifier (deploy/README.md §3.3, page /verifier du site) :"
            echo
            echo '```sh'
            echo "cosign verify-blob release.json --bundle release.json.sigstore.json \\"
            echo "  --certificate-oidc-issuer https://token.actions.githubusercontent.com \\"
            echo "  --certificate-identity https://github.com/$GITHUB_REPOSITORY/.github/workflows/release.yml@refs/tags/web-v$NUMERO"
            echo "cosign verify $PROVENANCE_IMAGE@$EMPREINTE \\"
            echo "  --certificate-oidc-issuer https://token.actions.githubusercontent.com \\"
            echo "  --certificate-identity https://github.com/$GITHUB_REPOSITORY/.github/workflows/release.yml@refs/tags/web-v$NUMERO"
            echo "node web/scripts/verify-site.mjs https://shhgone.com release.json"
            echo '```'
          } > "$RUNNER_TEMP/notes.md"
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "Version $NUMERO" --notes-file "$RUNNER_TEMP/notes.md" \
            "$rel/release.json" "$rel/release.json.sigstore.json" "$rel/image.json" "$rel/image.json.sigstore.json" \
            "$rel/SHA256SUMS" "$rel/dist.tar.gz"
