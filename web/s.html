<!doctype html>
<html lang="fr" translate="no">
  <head>
    <meta charset="utf-8" />
    <meta name="google" content="notranslate" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#0B0D12" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Shhgone" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <!-- Mona Sans n'est pas préchargée : mesuré (mobile, 4G lente), le préchargement prenait la bande
         passante des feuilles de style et des scripts et retardait le premier affichage (FCP de /s
         2,1 s → 1,65 s, de /offres 0,92 s → 0,79 s sans lui) ; décalage (CLS) inchangé, grâce au
         repli métrique « Mona Sans repli » (ui/fonts.css). -->
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="icon" href="/icon-192.png" sizes="192x192" type="image/png" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- PWA installable (avancée) : URL relatives dans le manifeste (base / ou /Shhdrop/). Aucun service worker ici. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="stylesheet" href="/src/ui/fonts.css" />
    <link rel="stylesheet" href="/src/ui/tokens.css" />
    <link rel="stylesheet" href="/src/ui/base.css" />
    <!-- Référencement : description par défaut (fr.ts, seo.home) ; app/seo.ts la met à jour par page,
         avec l'adresse canonique et « noindex » hors des pages publiques. Aperçu de lien (og:*) écrit
         au build sur les pages indexées seulement (scripts/seo-head.mjs), jamais sur s.html ni app.html. -->
    <meta
      name="description"
      content="Fichiers, photos, vidéos et notes chiffrés de bout en bout, sans compte, par un lien qui s'autodétruit, mot de passe en option. Illisible pour le serveur."
    />
    <!-- Page « /s » : ouverture et gestion d'un partage, jamais indexée. -->
    <meta name="robots" content="noindex" />
    <title>Ouvrir un partage · Shhgone</title>
  </head>
  <body>
    <div id="app"></div>
    <!-- Sans JavaScript : la clé du lien ne se lit et ne se déchiffre que sur l'appareil. -->
    <noscript>
      <h1>Ouvrir un partage Shhgone</h1>
      <p>Ce partage est chiffré de bout en bout : il s'ouvre dans votre navigateur, avec la clé du lien (et le mot de passe s'il en a un). Activez JavaScript pour l'ouvrir.</p>
    </noscript>
    <script type="module" src="/src/open/main.ts"></script>
  </body>
</html>
