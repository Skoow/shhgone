[package]
name = "shhdrop-core"
version = "0.1.0"
description = "Moteur de chiffrement et de format des partages Shhdrop (site, puis apps)"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
argon2 = { version = "0.6", default-features = false, features = ["alloc", "zeroize"] }
# blake2 et hmac ne sont pas appelés directement : déclarés pour activer `zeroize` (états internes
# de BLAKE2b dans Argon2id, de HMAC dans HKDF, effacés à la destruction ; Cargo unifie les fonctions).
blake2 = { version = "0.11", default-features = false, features = ["zeroize"] }
base64 = { version = "0.23", default-features = false, features = ["alloc"] }
hkdf = "0.13"
hmac = { version = "0.13", default-features = false, features = ["zeroize"] }
sha2 = { version = "0.11", default-features = false, features = ["zeroize"] }
# Lecture du manifeste (JSON) ; aucune dérivation serde : arbre `Value`, vérifié champ par champ.
# float_roundtrip : nombres arrondis au plus près, comme JSON.parse (sinon écart possible d’un ULP).
serde_json = { version = "1", features = ["float_roundtrip"] }
subtle = { version = "2.6", default-features = false }
unicode-normalization = { version = "0.1", default-features = false }
# Pseudo (compte v2 et salon, spec §39.4 point 4) : graphèmes (UAX #29), écritures (UAX #24),
# squelette UTS #39. Aucune crate nouvelle : mêmes versions exactes que shhdrop-salon, qui les
# utilisait déjà (règle du pseudo tenue ici pour n'en avoir qu'une copie).
unicode-segmentation = "=1.13.3"
unicode-script = "=0.5.9"
unicode-security = "=0.1.3"
zeroize = { version = "1.9", default-features = false, features = ["alloc"] }
# Jetons anonymes (Privacy Pass, RSA aveugle ; conception du paiement §7, §12) : exception écrite dans
# règles du projet, version exacte après revue de chaîne
# d'approvisionnement ; seulement avec la fonction « jetons » (module des jetons du site,
# shhdrop-jetons-wasm, et apps), jamais dans le moteur des partages (shhdrop-wasm) ni
# dans le module du salon. rand_core : trait du générateur de la bibliothèque (même version).
blind-rsa-signatures = { version = "=0.19.0", default-features = false, optional = true }
rand_core = { version = "0.10", default-features = false, optional = true }

# Fournisseur natif (tests aujourd'hui, apps plus tard) : n'entre pas dans le .wasm du site.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
aes-gcm = { version = "0.11", default-features = false, features = ["aes", "zeroize"] }

[features]
# Empreinte SHA-256 par morceaux d'un fichier : activée par le moteur des partages
# (shhdrop-wasm) et les apps ; pas par le module du salon, qui reste sous son plafond de poids.
empreinte = []
# Jetons anonymes des offres payantes (jetons.rs) : module des jetons (shhdrop-jetons-wasm) et apps.
jetons = ["dep:blind-rsa-signatures", "dep:rand_core"]

[[bench]]
name = "argon2"
harness = false
